<text x="45" y="204" text-anchor="start" class="s">settings-v2/harness-sync-skills.tsx</text>
<rect class="sub" x="35" y="250" width="220" height="64" rx="6"/>
<text x="45" y="268" text-anchor="start" class="t">HarnessSyncNotifier</text>
<text x="45" y="284" text-anchor="start" class="s">toast when another computer saved</text>
<rect class="box" x="300" y="150" width="190" height="104" rx="6"/>
<text x="310" y="168" text-anchor="start" class="s">«interface»</text>
<text x="310" y="184" text-anchor="start" class="t">window.api.harnessSync</text>
<text x="310" y="200" text-anchor="start" class="s">desktop/src/preload</text>
<text x="310" y="216" text-anchor="start" class="s">harness IDs, presets,</text>
<text x="310" y="232" text-anchor="start" class="s">skill names only</text>
<rect class="zone" x="520" y="60" width="250" height="310" rx="10"/>
<text x="530" y="76" text-anchor="start" class="zonet">Electron main (desktop/src/main)</text>
<rect class="sub" x="535" y="90" width="220" height="264" rx="6"/>
<text x="545" y="108" text-anchor="start" class="t">harness-sync/</text>
<text x="545" y="124" text-anchor="start" class="s">service.ts: one queue, 5 s check</text>
<text x="545" y="140" text-anchor="start" class="s">document.ts: sync file v5</text>
<text x="545" y="156" text-anchor="start" class="s">apply.ts: instruction files</text>
<text x="545" y="172" text-anchor="start" class="s">skills.ts: copies, backups</text>
<text x="545" y="188" text-anchor="start" class="s">tools.ts: paths on macOS/Windows</text>
<text x="545" y="204" text-anchor="start" class="s">state.ts: last applied hashes</text>
<text x="545" y="220" text-anchor="start" class="s">standalone.ts: follow the app</text>
<text x="545" y="236" text-anchor="start" class="s">ipc.ts: harness-sync-* handlers</text>
<text x="545" y="252" text-anchor="start" class="s">harness-sync-service.ts:</text>
<text x="545" y="268" text-anchor="start" class="s">native file dialogs</text>
<rect class="store" x="800" y="70" width="160" height="76" rx="6"/>
<text x="810" y="88" text-anchor="start" class="t">Drive folder</text>
<text x="810" y="104" text-anchor="start" class="s">harness-sync.json</text>
<text x="810" y="120" text-anchor="start" class="s">+ conflict copies</text>
<rect class="store" x="800" y="165" width="160" height="92" rx="6"/>
<text x="810" y="183" text-anchor="start" class="t">Harness files</text>
<text x="810" y="199" text-anchor="start" class="s">CLAUDE.md, AGENTS.md,</text>
<text x="810" y="215" text-anchor="start" class="s">GEMINI.md + skills/</text>
<text x="810" y="231" text-anchor="start" class="s">for six harnesses</text>
<rect class="store" x="800" y="276" width="160" height="92" rx="6"/>
<text x="810" y="294" text-anchor="start" class="t">App data</text>
<text x="810" y="310" text-anchor="start" class="s">userData/harness-sync/ or</text>
<text x="810" y="326" text-anchor="start" class="s">app.harnesssync.desktop/</text>
<text x="810" y="342" text-anchor="start" class="s">state.json, backups/</text>
