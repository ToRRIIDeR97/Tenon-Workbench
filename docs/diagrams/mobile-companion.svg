<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title desc">
<title id="title">Mobile companion</title>
<desc id="desc">On the phone, the Capacitor app shows a pairing screen until it has a device token. Pairing posts the code to /remote/pair on the desktop's second listener and stores the URL and token in the phone's secure store (Android Keystore or iOS Keychain). Once paired, the shell starts the same renderer as the desktop with a fetch that adds Authorization: Bearer to every request to that computer. The second listener forwards those requests to the loopback server, which applies the companion scope.</desc>
<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .ah{fill:#57606a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e}
    .store{fill:#2b2111;stroke:#d29922}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .e{stroke:#9198a1} .ah{fill:#9198a1}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="bg" width="980" height="330"/>
<text class="h" x="24" y="32">Mobile companion</text>

<rect class="zone" x="20" y="52" width="440" height="262" rx="10"/>
<text class="zonet" x="34" y="72">Phone (Capacitor app)</text>
<rect class="box" x="44" y="88" width="190" height="76" rx="8"/>
<text class="t" x="58" y="112">Pairing screen</text>
<text class="s" x="58" y="132">address + code, or QR code</text>
<text class="s" x="58" y="150">pairDevice → token</text>
<rect class="store" x="44" y="200" width="190" height="88" rx="8"/>
<text class="t" x="58" y="224">SecureStore plugin</text>
<text class="s" x="58" y="244">Android Keystore (AES-GCM)</text>
<text class="s" x="58" y="262">iOS Keychain (unverified)</text>
<text class="s" x="58" y="280">URL, device ID, token</text>
<rect class="box" x="258" y="88" width="182" height="200" rx="8"/>
<text class="t" x="272" y="112">Renderer (@tenon/app)</text>
<text class="s" x="272" y="132">phone layout</text>
<text class="s" x="272" y="150">bearerFetch: every request</text>
<text class="s" x="272" y="168">to the computer carries</text>
<text class="s" x="272" y="186">Authorization: Bearer</text>
<text class="s" x="272" y="210">Settings › Servers ›</text>
<text class="s" x="272" y="228">This phone › Sign out</text>

<rect class="zone" x="520" y="52" width="440" height="262" rx="10"/>
<text class="zonet" x="534" y="72">Computer (Tenon Workbench)</text>
<rect class="proc" x="544" y="88" width="190" height="96" rx="8"/>
<text class="t" x="558" y="112">Second listener</text>
<text class="s" x="558" y="132">LAN or VPN address</text>
<text class="s" x="558" y="150">CORS for the app's origin,</text>
<text class="s" x="558" y="168">Origin dropped, then forward</text>
<rect class="box" x="760" y="88" width="180" height="96" rx="8"/>
<text class="t" x="774" y="112">Local server</text>
<text class="s" x="774" y="132">device token → device</text>
<text class="s" x="774" y="150">companion scope</text>

<path class="e" d="M139 164 V200" marker-end="url(#a)"/>
<path class="e" d="M234 126 H258" marker-end="url(#a)"/>
<path class="e" d="M440 136 H544" marker-end="url(#a)"/>
<rect class="lblbg" x="448" y="114" width="90" height="16"/><text class="lbl" x="450" y="126">plain HTTP</text>
<path class="e" d="M139 88 V64 H480 V112 H544" marker-end="url(#a)"/>
<rect class="lblbg" x="300" y="56" width="120" height="16"/><text class="lbl" x="302" y="68">POST /remote/pair</text>
<path class="e" d="M734 136 H760" marker-end="url(#a)"/>
</svg>
