<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="title desc">
<title id="title">Thread sync engine</title>
<desc id="desc">On the owning computer the ThreadSync engine reads one thread's event log from tenon.db, seals the new events with the sync key and writes a segment and an encrypted manifest to an object store with conditional writes. The store is a local folder or a Cloud Storage bucket; it holds only sealed objects under threads/sessionID/. Another computer's engine reads the manifest and segments, opens them, checks that its own log agrees, replays the missing events into its tenon.db and can take the thread over with a conditional manifest write.</desc>

<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .sub{fill:#ffffff;stroke:#8c959f;stroke-width:1}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .ah{fill:#57606a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e} .sub{fill:#0d1117;stroke:#6e7681}
    .store{fill:#2b2111;stroke:#d29922} .ext{fill:#0c2d4a;stroke:#4493f8}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .e{stroke:#9198a1} .ah{fill:#9198a1}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="980" height="470"/>
<text x="20" y="28" class="h">Thread sync engine</text>
<text x="20" y="46" class="s">component view · tenon/packages/core/src/thread-sync · everything stored is sealed with the sync key</text>

<rect class="zone" x="20" y="60" width="270" height="300" rx="10"/>
<text x="30" y="76" class="zonet">Computer A (owner)</text>
<rect class="sub" x="35" y="90" width="240" height="76" rx="6"/>
<text x="45" y="108" class="t">tenon.db</text>
<text x="45" y="124" class="s">event: one log per thread</text>
<text x="45" y="140" class="s">event_sequence.owner_id = A</text>
<text x="45" y="156" class="s">session, project rows</text>
<rect class="box" x="35" y="200" width="240" height="144" rx="6"/>
<text x="45" y="218" class="t">ThreadSync.make</text>
<text x="45" y="234" class="s">engine.ts</text>
<text x="45" y="252" class="s">push: owner only, events after head</text>
<text x="45" y="268" class="s">seal: AES-256-GCM, fresh nonce,</text>
<text x="45" y="284" class="s">bound to thread and previous hash</text>
<text x="45" y="302" class="s">list: newest push first</text>
<text x="45" y="318" class="s">remove: owner only, never local</text>

<rect class="store" x="355" y="90" width="270" height="214" rx="6"/>
<text x="365" y="108" class="s">«interface» Store</text>
<text x="365" y="124" class="t">Object store</text>
<text x="365" y="140" class="s">folderStore: a folder, lock + rename</text>
<text x="365" y="156" class="s">gcsStore: Cloud Storage JSON API</text>
<text x="365" y="180" class="t">threads/&lt;sessionID&gt;/manifest</text>
<text x="365" y="196" class="s">sealed: owner, head, updatedAt, title,</text>
<text x="365" y="212" class="s">directory, project, segment list</text>
<text x="365" y="236" class="t">threads/&lt;sessionID&gt;/segment-</text>
<text x="365" y="252" class="t">&lt;first&gt;-&lt;last&gt;-&lt;sha256&gt;</text>
<text x="365" y="268" class="s">sealed run of consecutive events</text>
<text x="365" y="290" class="s">every engine put carries ifGeneration</text>

<rect class="ext" x="355" y="340" width="270" height="60" rx="6"/>
<text x="365" y="358" class="t">Your Cloud Storage bucket</text>
<text x="365" y="374" class="s">bearer token from token(); P5 signs in</text>

<rect class="zone" x="690" y="60" width="270" height="300" rx="10"/>
<text x="700" y="76" class="zonet">Computer B</text>
<rect class="box" x="705" y="90" width="240" height="144" rx="6"/>
<text x="715" y="108" class="t">ThreadSync.make</text>
<text x="715" y="124" class="s">engine.ts</text>
<text x="715" y="142" class="s">pull: get, open, compare local log</text>
<text x="715" y="158" class="s">diverged: log and owner unchanged</text>
<text x="715" y="176" class="s">takeOver: pull to head, then</text>
<text x="715" y="192" class="s">put manifest with owner B and</text>
<text x="715" y="208" class="s">the generation it read</text>
<rect class="sub" x="705" y="268" width="240" height="76" rx="6"/>
<text x="715" y="286" class="t">tenon.db</text>
<text x="715" y="302" class="s">replayAll after the project row</text>
<text x="715" y="318" class="s">owner_id mirrors the manifest owner</text>
<text x="715" y="334" class="s">local prompts still append</text>

<rect class="proc" x="20" y="385" width="310" height="66" rx="6"/>
<text x="30" y="403" class="t">Sync key (32 bytes)</text>
<text x="30" y="419" class="s">generateKey, keyFromPhrase; kept per computer</text>
<text x="30" y="435" class="s">lost key: the stored copy cannot be opened</text>

<path class="e" d="M155,166 L155,200" marker-end="url(#a)"/>
<path class="e" d="M275,250 L355,190" marker-end="url(#a)"/>
<path class="e" d="M625,170 L705,150" marker-end="url(#a)" marker-start="url(#a)"/>
<path class="e" d="M825,234 L825,268" marker-end="url(#a)"/>
<path class="e" d="M490,304 L490,340" marker-end="url(#a)" marker-start="url(#a)"/>
<path class="e" d="M175,385 L175,344" marker-end="url(#a)"/>

<rect class="lblbg" x="160" y="176" width="52" height="13" rx="2"/>
<text class="lbl" x="186" y="186" text-anchor="middle">read log</text>
<rect class="lblbg" x="276" y="208" width="76" height="13" rx="2"/>
<text class="lbl" x="314" y="218" text-anchor="middle">put segment,</text>
<rect class="lblbg" x="276" y="222" width="76" height="13" rx="2"/>
<text class="lbl" x="314" y="232" text-anchor="middle">put manifest</text>
<rect class="lblbg" x="628" y="134" width="74" height="13" rx="2"/>
<text class="lbl" x="665" y="144" text-anchor="middle">get · takeOver</text>
<rect class="lblbg" x="830" y="244" width="48" height="13" rx="2"/>
<text class="lbl" x="854" y="254" text-anchor="middle">replay</text>
<rect class="lblbg" x="496" y="315" width="52" height="13" rx="2"/>
<text class="lbl" x="522" y="325" text-anchor="middle">gcsStore</text>
<rect class="lblbg" x="181" y="358" width="40" height="13" rx="2"/>
<text class="lbl" x="201" y="368" text-anchor="middle">seals</text>
</svg>
