<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="title desc">
<title id="title">Thread sync in the desktop app</title>
<desc id="desc">Settings › Sync in the renderer calls the desktop main process over IPC for the OAuth client, sign-in and the sync key, and the local server over /api/thread-sync for the switch, folder and computer names, the stored threads and Continue here. The main process signs in through the system browser and a loopback listener with PKCE against Google's OAuth endpoints, using the user's own Desktop app client and the drive.file scope. It keeps the client secret, the refresh token and the key sealed with safeStorage in the tenon.thread-sync store, the access token only in memory, and answers the server's sync_key and sync_token calls on the loopback bridge. The server's manager uses the key and token for the Google Drive store.</desc>
<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .ah{fill:#57606a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e}
    .store{fill:#2b2111;stroke:#d29922} .ext{fill:#0c2d4a;stroke:#4493f8}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .e{stroke:#9198a1} .ah{fill:#9198a1}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="bg" width="980" height="470"/>
<text class="h" x="24" y="32">Thread sync in the desktop app</text>

<rect class="zone" x="20" y="52" width="640" height="396" rx="10"/>
<text class="zonet" x="34" y="72">This computer</text>

<rect class="box" x="44" y="90" width="250" height="96" rx="8"/>
<text class="t" x="58" y="114">Renderer: Settings › Sync</text>
<text class="s" x="58" y="134">sync.tsx, thread-sync-model.ts</text>
<text class="s" x="58" y="152">client, sign-in, key and phrase,</text>
<text class="s" x="58" y="170">switch, names, stored threads</text>

<rect class="proc" x="44" y="250" width="250" height="110" rx="8"/>
<text class="t" x="58" y="274">Desktop main: thread-sync/</text>
<text class="s" x="58" y="294">oauth.ts: loopback + PKCE</text>
<text class="s" x="58" y="312">service.ts: seal, refresh, bridge</text>
<text class="s" x="58" y="330">phrase.ts: key ⇄ recovery phrase</text>
<text class="s" x="58" y="348">access token in memory only</text>

<rect class="store" x="44" y="388" width="250" height="44" rx="8"/>
<text class="t" x="58" y="408">tenon.thread-sync store</text>
<text class="s" x="58" y="424">client ID; sealed secret, refresh token, key</text>

<rect class="box" x="390" y="250" width="250" height="110" rx="8"/>
<text class="t" x="404" y="274">Local server</text>
<text class="s" x="404" y="294">/api/thread-sync, ThreadSync.manager</text>
<text class="s" x="404" y="312">bridgeCredentials asks for</text>
<text class="s" x="404" y="330">sync_key and sync_token per call</text>
<text class="s" x="404" y="348">driveStore(token, folder)</text>

<rect class="ext" x="720" y="90" width="236" height="96" rx="8"/>
<text class="t" x="734" y="114">System browser</text>
<text class="s" x="734" y="134">Google sign-in page</text>
<text class="s" x="734" y="152">user's own Desktop app client</text>
<text class="s" x="734" y="170">scope drive.file</text>

<rect class="ext" x="720" y="250" width="236" height="110" rx="8"/>
<text class="t" x="734" y="274">Google</text>
<text class="s" x="734" y="294">oauth2.googleapis.com/token</text>
<text class="s" x="734" y="312">and /revoke</text>
<text class="s" x="734" y="330">Drive v3: "Tenon Workbench</text>
<text class="s" x="734" y="348">Threads" folder, sealed files</text>

<path class="e" d="M169 186 V250" marker-end="url(#a)"/>
<rect class="lblbg" x="176" y="208" width="34" height="16"/><text class="lbl" x="178" y="220">IPC</text>
<path class="e" d="M294 120 H360 V300 H390" marker-end="url(#a)"/>
<rect class="lblbg" x="300" y="128" width="112" height="16"/><text class="lbl" x="302" y="140">/api/thread-sync</text>
<path class="e" d="M169 360 V388" marker-end="url(#a)"/>
<path class="e" d="M390 330 H294" marker-end="url(#a)"/>
<rect class="lblbg" x="300" y="336" width="88" height="16"/><text class="lbl" x="302" y="348">loopback bridge</text>
<path class="e" d="M294 262 H680 V140 H720" marker-end="url(#a)"/>
<rect class="lblbg" x="560" y="214" width="112" height="16"/><text class="lbl" x="562" y="226">openExternal + 127.0.0.1</text>
<path class="e" d="M640 290 H720" marker-end="url(#a)"/>
<rect class="lblbg" x="652" y="296" width="60" height="16"/><text class="lbl" x="654" y="308">Drive API</text>
<path class="e" d="M294 352 H360 V440 H838 V360" marker-end="url(#a)"/>
<rect class="lblbg" x="560" y="432" width="104" height="16"/><text class="lbl" x="562" y="444">token, refresh, revoke</text>
</svg>
