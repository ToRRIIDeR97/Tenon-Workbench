<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img">
  <title>Current: one tree of Projects</title>
  <desc>Sync stores feed the sidebar controller, which builds one tree grouped by Project. Only a row shows a running dot, so a collapsed Project shows nothing.</desc>
  <style>
    .b{fill:#F1EFE8;stroke:#888780;stroke-width:.5}.w{fill:#FAECE7;stroke:#D85A30;stroke-width:.5}
    .t{font:500 14px sans-serif;fill:#2C2C2A}.s{font:400 12px sans-serif;fill:#5F5E5A}.a{stroke:#888780;stroke-width:1;fill:none}
    @media (prefers-color-scheme:dark){.b{fill:#2C2C2A;stroke:#B4B2A9}.w{fill:#4A1B0C;stroke:#F0997B}.t{fill:#F1EFE8}.s{fill:#D3D1C7}}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"/></marker></defs>
  <rect class="b" x="40" y="30" width="170" height="56" rx="8"/><text class="t" x="125" y="52" text-anchor="middle">Sync stores</text><text class="s" x="125" y="70" text-anchor="middle">sessions, working</text>
  <rect class="b" x="255" y="30" width="170" height="56" rx="8"/><text class="t" x="340" y="52" text-anchor="middle">Sidebar controller</text><text class="s" x="340" y="70" text-anchor="middle">groupSidebarThreads</text>
  <rect class="b" x="470" y="30" width="170" height="56" rx="8"/><text class="t" x="555" y="52" text-anchor="middle">ProjectGroup</text><text class="s" x="555" y="70" text-anchor="middle">tree by Project only</text>
  <rect class="w" x="470" y="130" width="170" height="56" rx="8"/><text class="t" x="555" y="152" text-anchor="middle">ThreadRow</text><text class="s" x="555" y="170" text-anchor="middle">only signal: pulsing dot</text>
  <line class="a" x1="210" y1="58" x2="251" y2="58" marker-end="url(#h)"/><line class="a" x1="425" y1="58" x2="466" y2="58" marker-end="url(#h)"/><line class="a" x1="555" y1="86" x2="555" y2="126" marker-end="url(#h)"/>
</svg>
