<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
  <title>Implementation: from run status to the card</title>
  <desc>threadState reads agentRunStatus. nodeState takes the most urgent state in a subtree. The controller builds cards for the chosen mode. The view shows marks, and the top line appears while the summary has running threads. Linked to AC-1 to AC-8.</desc>
  <style>
    .n{fill:#E1F5EE;stroke:#1D9E75;stroke-width:.5}.b{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
    .t{font:500 14px sans-serif;fill:#2C2C2A}.s{font:400 12px sans-serif;fill:#5F5E5A}.a{stroke:#888780;stroke-width:1;fill:none}
    @media (prefers-color-scheme:dark){.b{fill:#2C2C2A;stroke:#B4B2A9}.n{fill:#04342C;stroke:#5DCAA5}.t{fill:#F1EFE8}.s{fill:#D3D1C7}}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"/></marker></defs>
  <rect class="b" x="40" y="24" width="280" height="50" rx="8"/><text class="t" x="180" y="44" text-anchor="middle">agentRunStatus (unchanged)</text><text class="s" x="180" y="61" text-anchor="middle">approval, running, retrying</text>
  <rect class="n" x="40" y="100" width="280" height="50" rx="8"/><text class="t" x="180" y="120" text-anchor="middle">threadState, nodeState (AC-3, AC-5)</text><text class="s" x="180" y="137" text-anchor="middle">most urgent state in a subtree</text>
  <rect class="n" x="360" y="100" width="280" height="50" rx="8"/><text class="t" x="500" y="120" text-anchor="middle">parseGrouping, state.grouping (AC-1)</text><text class="s" x="500" y="137" text-anchor="middle">Persist.window("sidebar")</text>
  <rect class="n" x="200" y="176" width="280" height="50" rx="8"/><text class="t" x="340" y="196" text-anchor="middle">Controller cards() (AC-3, AC-4, AC-8)</text><text class="s" x="340" y="213" text-anchor="middle">order also drives previous and next</text>
  <rect class="n" x="40" y="252" width="280" height="50" rx="8"/><text class="t" x="180" y="272" text-anchor="middle">Card and row marks (AC-2, AC-5)</text><text class="s" x="180" y="289" text-anchor="middle">shape plus accessible name</text>
  <rect class="n" x="360" y="252" width="280" height="50" rx="8"/><text class="t" x="500" y="272" text-anchor="middle">.sidebar-card-line (AC-6, AC-7)</text><text class="s" x="500" y="289" text-anchor="middle">transform, still under reduced motion</text>
  <line class="a" x1="180" y1="74" x2="180" y2="96" marker-end="url(#h)"/>
  <path class="a" d="M180 150V163H300V172" marker-end="url(#h)"/><path class="a" d="M500 150V163H380V172" marker-end="url(#h)"/>
  <path class="a" d="M300 226V239H180V248" marker-end="url(#h)"/><path class="a" d="M380 226V239H500V248" marker-end="url(#h)"/>
</svg>
