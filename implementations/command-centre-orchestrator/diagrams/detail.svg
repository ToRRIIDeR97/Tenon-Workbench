<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" font-family="Inter, system-ui, sans-serif">
<title>Workflow run detail</title><desc>Start sends the director brief; the director delegates and writes report lines; the app parses them, sums spend and aborts at a limit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="160" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="100.0" y="41.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Start (AC-3.4)</text>
<text x="100.0" y="58.0" text-anchor="middle" font-size="11" fill="#374151">validateWorkflow first</text>
<rect x="210" y="20" width="160" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="290.0" y="41.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Director thread</text>
<text x="290.0" y="58.0" text-anchor="middle" font-size="11" fill="#374151">directorBrief</text>
<rect x="400" y="20" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="480.0" y="41.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">delegate_task</text>
<text x="480.0" y="58.0" text-anchor="middle" font-size="11" fill="#374151">implementor, reviewer</text>
<rect x="590" y="20" width="150" height="48" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="665.0" y="41.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Child threads</text>
<text x="665.0" y="58.0" text-anchor="middle" font-size="11" fill="#374151">cost per thread</text>
<rect x="210" y="130" width="160" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="290.0" y="151.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Report lines</text>
<text x="290.0" y="168.0" text-anchor="middle" font-size="11" fill="#374151">[[round N | role | status]]</text>
<rect x="400" y="130" width="160" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="480.0" y="151.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">parseReports</text>
<text x="480.0" y="168.0" text-anchor="middle" font-size="11" fill="#374151">then applyReports</text>
<rect x="590" y="130" width="150" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="665.0" y="151.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">runSpend</text>
<text x="665.0" y="168.0" text-anchor="middle" font-size="11" fill="#374151">root + descendants</text>
<rect x="400" y="240" width="160" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="480.0" y="261.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">stopReason (AC-4.4)</text>
<text x="480.0" y="278.0" text-anchor="middle" font-size="11" fill="#374151">budget, then rounds</text>
<rect x="590" y="240" width="150" height="48" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="665.0" y="261.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Abort director</text>
<text x="665.0" y="278.0" text-anchor="middle" font-size="11" fill="#374151">over-budget / out-of-rounds</text>
<rect x="20" y="240" width="350" height="48" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="195.0" y="269.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Approved round: run is done; nothing is pushed or merged</text>
