<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" role="img" font-family="Inter, system-ui, sans-serif">
<title>Proposed Command Centre</title><desc>The page gains a board, a queue, workflows and runs; the agent gains thread tools and an action log.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="760" height="400" fill="#ffffff"/>
<rect x="20" y="20" width="170" height="52" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="105.0" y="43.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Board (AC-1)</text>
<text x="105.0" y="60.0" text-anchor="middle" font-size="11" fill="#374151">mission-board.ts</text>
<rect x="205" y="20" width="170" height="52" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="290.0" y="43.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Waiting on you (AC-2)</text>
<text x="290.0" y="60.0" text-anchor="middle" font-size="11" fill="#374151">approval-queue.ts</text>
<rect x="390" y="20" width="170" height="52" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="475.0" y="43.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Workflows (AC-3)</text>
<text x="475.0" y="60.0" text-anchor="middle" font-size="11" fill="#374151">workflows.ts</text>
<rect x="575" y="20" width="165" height="52" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="657.5" y="43.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Runs (AC-4)</text>
<text x="657.5" y="60.0" text-anchor="middle" font-size="11" fill="#374151">workflow-runs.ts</text>
<rect x="20" y="130" width="355" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="197.5" y="153.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">useProjectThreads + synced status</text>
<text x="197.5" y="170.0" text-anchor="middle" font-size="11" fill="#374151">existing queries, no new polling</text>
<rect x="390" y="130" width="350" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="565.0" y="153.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Director thread in a Project</text>
<text x="565.0" y="170.0" text-anchor="middle" font-size="11" fill="#374151">brief from directorBrief, delegate_task</text>
<rect x="20" y="240" width="220" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="130.0" y="263.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Command Centre agent</text>
<text x="130.0" y="280.0" text-anchor="middle" font-size="11" fill="#374151">COMMAND_TOOLS</text>
<rect x="270" y="240" width="220" height="52" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="380.0" y="263.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Thread tools (AC-2.3 to 2.5)</text>
<text x="380.0" y="280.0" text-anchor="middle" font-size="11" fill="#374151">overview, read, message, stop</text>
<rect x="520" y="240" width="220" height="52" rx="6" fill="#e0f2ef" stroke="#0f766e"/>
<text x="630.0" y="263.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Action log (AC-2.2)</text>
<text x="630.0" y="280.0" text-anchor="middle" font-size="11" fill="#374151">command-actions.ts + read route</text>
<rect x="20" y="330" width="720" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="380.0" y="357.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Invariants: no tool answers approvals; a run never pushes or merges; limits apply while the app is open</text>
<path d="M105 72V128" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M290 72V128" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/>
<text x="296" y="104" font-size="11" fill="#374151">reads</text>
<path d="M475 72V128" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/>
<text x="481" y="104" font-size="11" fill="#374151">Start</text>
<path d="M657 72V128" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/>
<text x="540" y="104" font-size="11" fill="#374151">reads reports, aborts</text>
<path d="M240 266H268" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M490 266H518" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/>
<text x="494" y="258" font-size="11" fill="#374151">logs</text>
<text x="20" y="392" font-size="11" fill="#374151">Teal: new or changed. Grey: existing.</text>
</svg>
