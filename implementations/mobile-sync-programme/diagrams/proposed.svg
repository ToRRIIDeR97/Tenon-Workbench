<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 426" role="img"><title>Proposed system</title><desc>A phone app pairs with the Tenon server using device tokens. Thread sync writes encrypted segments to a folder in the person's Google Drive that another computer reads. Device tools are fixed.</desc><style>.t{font:14px sans-serif;fill:#2c2c2a}.th{font:500 14px sans-serif;fill:#2c2c2a}.ts{font:12px sans-serif;fill:#5f5e5a}.box{fill:#f1efe8;stroke:#888780}.c-teal>rect{fill:#e1f5ee;stroke:#0f6e56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0f6e56}.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}@media (prefers-color-scheme:dark){.t,.th{fill:#f1efe8}.ts{fill:#b4b2a9}.box{fill:#2c2c2a;stroke:#b4b2a9}.c-teal>rect{fill:#085041;stroke:#5dcaa5}.c-teal>.th{fill:#e1f5ee}.c-teal>.ts{fill:#9fe1cb}.arr{stroke:#b4b2a9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-teal"><rect x="50" y="30" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="49" text-anchor="middle" dominant-baseline="central">Phone app</text><text class="ts" x="140" y="68" text-anchor="middle" dominant-baseline="central">Capacitor, phone layout</text></g><g class="c-teal"><rect x="250" y="30" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Other computer</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Replays, takes over</text></g><g class="c-teal"><rect x="450" y="30" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="49" text-anchor="middle" dominant-baseline="central">Google Drive folder</text><text class="ts" x="540" y="68" text-anchor="middle" dominant-baseline="central">Encrypted segments</text></g><rect x="30" y="130" width="620" height="244" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/><text class="ts" x="46" y="148" dominant-baseline="central">This computer</text><g class=""><rect class="box" x="50" y="174" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="193" text-anchor="middle" dominant-baseline="central">Renderer</text><text class="ts" x="140" y="212" text-anchor="middle" dominant-baseline="central">Solid app, phone layout</text></g><g class=""><rect class="box" x="250" y="174" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="193" text-anchor="middle" dominant-baseline="central">Electron main</text><text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">IPC, Device tab tools</text></g><g class="c-teal"><rect x="450" y="174" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="193" text-anchor="middle" dominant-baseline="central">Tenon server</text><text class="ts" x="540" y="212" text-anchor="middle" dominant-baseline="central">Pairing, device tokens</text></g><g class=""><rect class="box" x="50" y="274" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="293" text-anchor="middle" dominant-baseline="central">Event log</text><text class="ts" x="140" y="312" text-anchor="middle" dominant-baseline="central">tenon.db, per thread</text></g><g class="c-teal"><rect x="250" y="274" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="293" text-anchor="middle" dominant-baseline="central">Device tools</text><text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">Fixed keys, boot state</text></g><g class="c-teal"><rect x="450" y="274" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="293" text-anchor="middle" dominant-baseline="central">Thread sync</text><text class="ts" x="540" y="312" text-anchor="middle" dominant-baseline="central">Segments, ownership</text></g><path d="M230 202L248 202" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M430 202L448 202" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M340 230L340 272" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M540 230L540 272" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M140 86L140 110L500 110L500 172" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M430 58L448 58" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M630 302L640 302L640 58L632 58" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M540 330L540 350L140 350L140 332" class="arr" fill="none" marker-end="url(#arrow)"/><g class="c-teal"><rect x="50" y="392" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="72" y="399" dominant-baseline="central">New or changed</text><rect class="box" x="190" y="392" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="212" y="399" dominant-baseline="central">Unchanged</text></svg>
