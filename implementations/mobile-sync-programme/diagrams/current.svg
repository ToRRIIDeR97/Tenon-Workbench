<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 316" role="img"><title>Current system</title><desc>Renderer, Electron main and a loopback-only Tenon server on one computer. Device tools and the event log sit under them. There is no phone client and threads stay local.</desc><style>.t{font:14px sans-serif;fill:#2c2c2a}.th{font:500 14px sans-serif;fill:#2c2c2a}.ts{font:12px sans-serif;fill:#5f5e5a}.box{fill:#f1efe8;stroke:#888780}.c-teal>rect{fill:#e1f5ee;stroke:#0f6e56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0f6e56}.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}@media (prefers-color-scheme:dark){.t,.th{fill:#f1efe8}.ts{fill:#b4b2a9}.box{fill:#2c2c2a;stroke:#b4b2a9}.c-teal>rect{fill:#085041;stroke:#5dcaa5}.c-teal>.th{fill:#e1f5ee}.c-teal>.ts{fill:#9fe1cb}.arr{stroke:#b4b2a9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="30" width="620" height="236" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/><text class="ts" x="46" y="48" dominant-baseline="central">This computer</text><g class=""><rect class="box" x="50" y="74" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="93" text-anchor="middle" dominant-baseline="central">Renderer</text><text class="ts" x="140" y="112" text-anchor="middle" dominant-baseline="central">Solid app, one window</text></g><g class=""><rect class="box" x="250" y="74" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="93" text-anchor="middle" dominant-baseline="central">Electron main</text><text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">IPC, Device tab tools</text></g><g class=""><rect class="box" x="450" y="74" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="93" text-anchor="middle" dominant-baseline="central">Tenon server</text><text class="ts" x="540" y="112" text-anchor="middle" dominant-baseline="central">Loopback, one password</text></g><g class=""><rect class="box" x="250" y="180" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="199" text-anchor="middle" dominant-baseline="central">Device tools</text><text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">adb, simctl, idb</text></g><g class=""><rect class="box" x="450" y="180" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="199" text-anchor="middle" dominant-baseline="central">Event log</text><text class="ts" x="540" y="218" text-anchor="middle" dominant-baseline="central">tenon.db, per thread</text></g><path d="M230 102L248 102" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M430 102L448 102" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M340 130L340 178" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M540 130L540 178" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central">Limits: no phone client, threads stay on this computer, every iOS key presses Home</text></svg>
