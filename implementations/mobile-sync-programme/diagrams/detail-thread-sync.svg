<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 486" role="img"><title>Thread sync detail</title><desc>Six steps: computer A appends events, seals and uploads an encrypted segment, computer B downloads, replays and takes ownership.</desc><style>.t{font:14px sans-serif;fill:#2c2c2a}.th{font:500 14px sans-serif;fill:#2c2c2a}.ts{font:12px sans-serif;fill:#5f5e5a}.box{fill:#f1efe8;stroke:#888780}.c-teal>rect{fill:#e1f5ee;stroke:#0f6e56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0f6e56}.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}@media (prefers-color-scheme:dark){.t,.th{fill:#f1efe8}.ts{fill:#b4b2a9}.box{fill:#2c2c2a;stroke:#b4b2a9}.c-teal>rect{fill:#085041;stroke:#5dcaa5}.c-teal>.th{fill:#e1f5ee}.c-teal>.ts{fill:#9fe1cb}.arr{stroke:#b4b2a9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class=""><rect class="box" x="170" y="30" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Computer A appends events</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Event log, one sequence per thread</text></g><path d="M340 86L340 104" class="arr" fill="none" marker-end="url(#arrow)"/><g class="c-teal"><rect x="170" y="106" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="125" text-anchor="middle" dominant-baseline="central">A seals a segment</text><text class="ts" x="340" y="144" text-anchor="middle" dominant-baseline="central">Encrypted with the sync key</text></g><path d="M340 162L340 180" class="arr" fill="none" marker-end="url(#arrow)"/><g class="c-teal"><rect x="170" y="182" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="201" text-anchor="middle" dominant-baseline="central">A uploads the segment</text><text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">Only if the manifest is unchanged</text></g><path d="M340 238L340 256" class="arr" fill="none" marker-end="url(#arrow)"/><g class="c-teal"><rect x="170" y="258" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="277" text-anchor="middle" dominant-baseline="central">Computer B downloads and decrypts</text><text class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central">Checks sequence numbers and hashes</text></g><path d="M340 314L340 332" class="arr" fill="none" marker-end="url(#arrow)"/><g class="c-teal"><rect x="170" y="334" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="353" text-anchor="middle" dominant-baseline="central">B replays into its event log</text><text class="ts" x="340" y="372" text-anchor="middle" dominant-baseline="central">Stops if the history diverged</text></g><path d="M340 390L340 408" class="arr" fill="none" marker-end="url(#arrow)"/><g class="c-teal"><rect x="170" y="410" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="429" text-anchor="middle" dominant-baseline="central">B takes ownership</text><text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">A turns read-only for that thread</text></g></svg>
