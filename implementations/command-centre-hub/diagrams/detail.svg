<text x="100.0" y="160" font-size="11" fill="#0f6e56" text-anchor="middle">owned: parent|origin (AC-4)</text>
<rect x="20" y="230" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="100.0" y="252" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">sessionOrigin</text>
<text x="100.0" y="270" font-size="11" fill="#0f6e56" text-anchor="middle">V2 field | V1 metadata (AC-9)</text>
<rect x="200" y="230" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="280.0" y="252" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">hubCards</text>
<text x="280.0" y="270" font-size="11" fill="#0f6e56" text-anchor="middle">state, counts, harnesses (AC-13)</text>
<rect x="380" y="230" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="460.0" y="252" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">projectCrew</text>
<text x="460.0" y="270" font-size="11" fill="#0f6e56" text-anchor="middle">lead, agents, step (AC-11, 14)</text>
<rect x="560" y="230" width="140" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="630.0" y="252" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">Hub views</text>
<text x="630.0" y="270" font-size="11" fill="#0f6e56" text-anchor="middle">page, panel, dock (AC-15)</text>
<text x="20" y="320" font-size="11" fill="#5f5e5a">Without project_id steps 3 and 4 are skipped: child of the caller in its folder, no origin (AC-3).</text>
<text x="20" y="340" font-size="11" fill="#5f5e5a">thread_start stamps the same origin (AC-8). Approvals of a placed worker show in its thread and in Needs you.</text>
</svg>