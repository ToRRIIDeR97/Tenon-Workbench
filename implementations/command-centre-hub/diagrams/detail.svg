<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" font-family="Inter, Segoe UI, sans-serif">
<title>Implementation detail of a Project-placed delegation</title><desc>Order of a Project-placed delegation with failure paths, then the renderer models, each step tied to its acceptance criterion.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/></marker></defs>
<rect width="720" height="380" fill="#ffffff"/>
<line x1="180" y1="48" x2="198" y2="48" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<line x1="360" y1="48" x2="378" y2="48" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<line x1="540" y1="48" x2="558" y2="48" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<text x="549.0" y="42.0" font-size="11" fill="#5f5e5a" text-anchor="middle">undefined</text>
<line x1="460" y1="76" x2="460" y2="118" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<text x="460.0" y="91.0" font-size="11" fill="#5f5e5a" text-anchor="middle">folder</text>
<line x1="378" y1="148" x2="362" y2="148" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<line x1="198" y1="148" x2="182" y2="148" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<line x1="180" y1="258" x2="198" y2="258" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<line x1="360" y1="258" x2="378" y2="258" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<line x1="540" y1="258" x2="558" y2="258" stroke="#5f5e5a" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="20" width="160" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="100.0" y="42" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle">1 · parse</text>
<text x="100.0" y="60" font-size="11" fill="#5f5e5a" text-anchor="middle">project_id, trimmed</text>
<rect x="200" y="20" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="280.0" y="42" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">2 · limits</text>
<text x="280.0" y="60" font-size="11" fill="#0f6e56" text-anchor="middle">depth via parent|origin (AC-5)</text>
<rect x="380" y="20" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="460.0" y="42" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">3 · projectFolder</text>
<text x="460.0" y="60" font-size="11" fill="#0f6e56" text-anchor="middle">caller, id</text>
<rect x="560" y="20" width="140" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="630.0" y="42" font-size="13" font-weight="600" fill="#4a1b0c" text-anchor="middle">fails</text>
<text x="630.0" y="60" font-size="11" fill="#993c1d" text-anchor="middle">error names id (AC-2)</text>
<rect x="380" y="120" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="460.0" y="142" font-size="13" font-weight="600" fill="#04342c" text-anchor="middle">4 · create root</text>
<text x="460.0" y="160" font-size="11" fill="#0f6e56" text-anchor="middle">Project folder + origin</text>
<rect x="200" y="120" width="160" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="280.0" y="142" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle">5 · prompt, resume</text>
<text x="280.0" y="160" font-size="11" fill="#5f5e5a" text-anchor="middle">running entry (AC-6)</text>
<rect x="20" y="120" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
