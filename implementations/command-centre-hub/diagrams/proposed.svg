<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" font-family="Inter, Segoe UI, sans-serif">
<title>Proposed Command Centre delegation and hub</title><desc>delegate_task with project_id asks the app-tools provider for the Project folder and creates a root thread there with metadata.origin; ownership and depth follow origin; the renderer reads origin for the mark; /command opens the hub and a Project's crew.</desc>
