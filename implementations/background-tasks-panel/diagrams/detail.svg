<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="Detail: list, sections and the detail views"><style>.bg{fill:#fff}.b{fill:#f4f4f5;stroke:#c9c9cf;stroke-width:1}.n{fill:#e8edff;stroke:#3b5cf6}.c{fill:#fff;stroke:#3b5cf6;stroke-dasharray:4 3}.t{font:600 13px Inter,Segoe UI,sans-serif;fill:#18181b}.s{font:11px Inter,Segoe UI,sans-serif;fill:#52525b}.l{font:10px Inter,Segoe UI,sans-serif;fill:#52525b}.h{font:600 15px Inter,Segoe UI,sans-serif;fill:#18181b}.a{stroke:#71717a;stroke-width:1.25}</style><defs><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#71717a"/></marker></defs><rect class="bg" width="900" height="450"/><text x="20" y="28" class="h">Detail: list, sections and the detail views</text><g><rect x="20" y="50" width="270" height="165" rx="10" class="b n"/><text x="32" y="72" class="t">taskSections(tasks, filter, live)</text><text x="32" y="90" class="s">Running: pending or running, newest call first</text><text x="32" y="105" class="s">Finished: latest ended first</text><text x="32" y="120" class="s">filter: all | agent | command</text><text x="32" y="135" class="s">taskStatus: running, done, failed, stopped</text><text x="32" y="150" class="s">failed = error, or command exit code not 0</text><text x="32" y="165" class="s">stopped = Tool execution interrupted</text><text x="32" y="180" class="s">terminal_start: running while its PTY is in live</text></g><g><rect x="320" y="50" width="260" height="165" rx="10" class="b n"/><text x="332" y="72" class="t">List view</text><text x="332" y="90" class="s">filter pills with counts</text><text x="332" y="105" class="s">Running card or Nothing running line</text><text x="332" y="120" class="s">Finished card</text><text x="332" y="135" class="s">row: kind icon, title, time, status line</text><text x="332" y="150" class="s">terminal row: Running in a terminal tab</text><text x="332" y="165" class="s">row Stop button while running</text></g><g><rect x="610" y="50" width="270" height="165" rx="10" class="b n"/><text x="622" y="72" class="t">Detail view (ViewSwitch)</text><text x="622" y="90" class="s">command: CommandDetail (new)</text><text x="622" y="105" class="s">  output box, Copy output, Stop</text><text x="622" y="120" class="s">terminal: note, Show terminal, Stop</text><text x="622" y="135" class="s">  no output box, no Copy</text><text x="622" y="150" class="s">agent: AgentDetail (existing) plus Stop</text><text x="622" y="165" class="s">selection: selectAgent(sessionKey, partID)</text></g><line x1="290" y1="130" x2="318" y2="130" class="a" marker-end="url(#m)"/><line x1="580" y1="130" x2="608" y2="130" class="a" marker-end="url(#m)"/><text x="594" y="124" class="l" text-anchor="middle">open</text><g><rect x="20" y="250" width="420" height="170" rx="10" class="b n"/><text x="32" y="272" class="t">stopTarget(task, threadID, live)</text><text x="32" y="290" class="s">open agent terminal -> scope terminal, closes that PTY (AC-10)</text><text x="32" y="305" class="s">task subagent with child session -> child session, scope task</text><text x="32" y="320" class="s">other command, ACP subagent, child not started -> thread, scope turn</text><text x="32" y="335" class="s">not running -> undefined (no Stop shown)</text><text x="32" y="350" class="s">scope turn is labelled Stop turn: it ends the agents whole turn</text><text x="32" y="365" class="s">scope task and terminal are labelled Stop</text></g><g><rect x="470" y="250" width="410" height="170" rx="10" class="b c"/><text x="482" y="272" class="t">Not changed</text><text x="482" y="290" class="s">tab id agents, PanelSection agents, migrateAgentTabs</text><text x="482" y="305" class="s">SubagentLane in turn steps (the old Agents list that used it is removed)</text><text x="482" y="320" class="s">core, server, protocol: no new API</text><text x="482" y="335" class="s">context/terminal.tsx: read and called, not edited</text></g></svg>