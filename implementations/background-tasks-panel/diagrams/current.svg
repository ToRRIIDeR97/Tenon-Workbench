<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Current: the Agents section lists subagents only"><style>.bg{fill:#fff}.b{fill:#f4f4f5;stroke:#c9c9cf;stroke-width:1}.n{fill:#e8edff;stroke:#3b5cf6}.c{fill:#fff;stroke:#3b5cf6;stroke-dasharray:4 3}.t{font:600 13px Inter,Segoe UI,sans-serif;fill:#18181b}.s{font:11px Inter,Segoe UI,sans-serif;fill:#52525b}.l{font:10px Inter,Segoe UI,sans-serif;fill:#52525b}.h{font:600 15px Inter,Segoe UI,sans-serif;fill:#18181b}.a{stroke:#71717a;stroke-width:1.25}</style><defs><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#71717a"/></marker></defs><rect class="bg" width="900" height="330"/><text x="20" y="28" class="h">Current: the Agents section lists subagents only</text><g><rect x="20" y="50" width="190" height="80" rx="10" class="b "/><text x="32" y="72" class="t">Sync store</text><text x="32" y="90" class="s">message[sessionID]</text><text x="32" y="105" class="s">part[messageID]</text></g><g><rect x="260" y="50" width="220" height="80" rx="10" class="b "/><text x="272" y="72" class="t">threadSubagents()</text><text x="272" y="90" class="s">subagent-list.ts</text><text x="272" y="105" class="s">task + acp_subagent parts, by turn</text></g><g><rect x="530" y="50" width="170" height="80" rx="10" class="b "/><text x="542" y="72" class="t">AgentsTab</text><text x="542" y="90" class="s">subagent-tab.tsx</text><text x="542" y="105" class="s">list by turn, detail</text></g><g><rect x="730" y="50" width="150" height="80" rx="10" class="b "/><text x="742" y="72" class="t">Side panel</text><text x="742" y="90" class="s">section agents</text><text x="742" y="105" class="s">title Agents</text></g><g><rect x="260" y="170" width="220" height="80" rx="10" class="b "/><text x="272" y="192" class="t">subagentCounts().running</text><text x="272" y="210" class="s">session.tsx</text></g><g><rect x="530" y="170"