<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
  <title>Implementation: ComposerController.send</title>
  <desc>Enter without Shift or IME composition, or the send button, calls send. Empty, busy, disabled or blocked input returns without calling the page's send. Otherwise busy is set, the page's send is awaited, and on success the text is cleared if unchanged; on failure or a thrown error the text stays. Busy is cleared at the end.</desc>
  <style>
    .b{fill:#F1EFE8;stroke:#888780;stroke-width:.5}.n{fill:#E1F5EE;stroke:#1D9E75;stroke-width:.5}.d{fill:#FAECE7;stroke:#D85A30;stroke-width:.5}
    .t{font:500 14px sans-serif;fill:#2C2C2A}.s{font:400 12px sans-serif;fill:#5F5E5A}.a{stroke:#888780;stroke-width:1;fill:none}
    @media (prefers-color-scheme:dark){.b{fill:#2C2C2A;stroke:#B4B2A9}.n{fill:#04342C;stroke:#5DCAA5}.d{fill:#4A1B0C;stroke:#F0997B}.t{fill:#F1EFE8}.s{fill:#D3D1C7}}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"/></marker></defs>
  <rect class="b" x="190" y="20" width="300" height="56" rx="8"/><text class="t" x="340" y="42" text-anchor="middle">Enter (no Shift, not IME) or button</text><text class="s" x="340" y="60" text-anchor="middle">ComposerBox · AC-2, AC-5</text>
  <rect class="n" x="190" y="110" width="300" height="56" rx="8"/><text class="t" x="340" y="132" text-anchor="middle">controller.send()</text><text class="s" x="340" y="150" text-anchor="middle">trim; empty/busy/disabled/blocked?</text>
  <rect class="d" x="520" y="110" width="140" height="56" rx="8"/><text class="t" x="590" y="132" text-anchor="middle">Return</text><text class="s" x="590" y="150" text-anchor="middle">no call · AC-1</text>
  <rect class="n" x="190" y="200" width="300" height="56" rx="8"/><text class="t" x="340" y="222" text-anchor="middle">busy = true; await page send(text)</text><text class="s" x="340" y="240" text-anchor="middle">second send ignored · AC-3</text>
  <rect class="n" x="40" y="290" width="270" height="56" rx="8"/><text class="t" x="175" y="312" text-anchor="middle">true: clear if text unchanged</text><text class="s" x="175" y="330" text-anchor="middle">edits made while sending stay · AC-4</text>
  <rect class="d" x="370" y="290" width="270" height="56" rx="8"/><text class="t" x="505" y="312" text-anchor="middle">false or throws: keep text</text><text class="s" x="505" y="330" text-anchor="middle">AC-4</text>
  <rect class="b" x="190" y="370" width="300" height="44" rx="8"/><text class="t" x="340" y="397" text-anchor="middle">busy = false</text>
  <line class="a" x1="340" y1="76" x2="340" y2="106" marker-end="url(#h)"/><line class="a" x1="490" y1="138" x2="516" y2="138" marker-end="url(#h)"/>
  <line class="a" x1="340" y1="166" x2="340" y2="196" marker-end="url(#h)"/>
  <path class="a" d="M290 256 L290 272 L175 272 L175 286" marker-end="url(#h)"/><path class="a" d="M390 256 L390 272 L505 272 L505 286" marker-end="url(#h)"/>
  <path class="a" d="M175 346 L175 392 L186 392" marker-end="url(#h)"/><path class="a" d="M505 346 L505 392 L494 392" marker-end="url(#h)"/>
</svg>
