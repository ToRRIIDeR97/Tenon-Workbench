<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Proposed system: new parts and the criteria they satisfy</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="600" fill="#1c1b1f">Proposed (new parts in accent, criterion IDs in brackets)</text>
  <rect x="20" y="50" width="420" height="430" rx="10" fill="#f3f0f7" stroke="#79747e"/>
  <text x="36" y="74" font-weight="600" fill="#1c1b1f">Renderer (packages/app)</text>
  <g fill="#e8def8" stroke="#6750a4">
    <rect x="36" y="88" width="388" height="40" rx="6"/>
    <rect x="36" y="138" width="188" height="40" rx="6"/>
    <rect x="236" y="138" width="188" height="40" rx="6"/>
    <rect x="36" y="188" width="188" height="40" rx="6"/>
    <rect x="236" y="188" width="188" height="40" rx="6"/>
    <rect x="36" y="238" width="188" height="40" rx="6"/>
    <rect x="236" y="238" width="188" height="40" rx="6"/>
    <rect x="36" y="288" width="188" height="40" rx="6"/>
    <rect x="236" y="288" width="188" height="40" rx="6"/>
    <rect x="36" y="338" width="188" height="40" rx="6"/>
    <rect x="236" y="338" width="188" height="40" rx="6"/>
    <rect x="36" y="388" width="388" height="40" rx="6"/>
    <rect x="36" y="438" width="388" height="30" rx="6"/>
  </g>
  <g fill="#1c1b1f">
    <text x="46" y="113">Find bar + find target registry, mod+F  [AC-1..AC-5]</text>
    <text x="46" y="163">Thread find  [AC-2, AC-3]</text>
    <text x="246" y="163">Terminal find  [AC-5]</text>
    <text x="46" y="213">Backlinks panel  [AC-6, AC-7]</text>
    <text x="246" y="213">Rename / Move page  [AC-8, AC-9]</text>
    <text x="46" y="263">Templates + Daily  [AC-10..12]</text>
    <text x="246" y="263">Project templates  [AC-13]</text>
    <text x="46" y="313">Inbox triage  [AC-14, AC-15]</text>
    <text x="246" y="313">Reminders  [AC-16, AC-17]</text>
    <text x="46" y="363">Search everywhere  [AC-19]</text>
    <text x="246" y="363">Weekly review  [AC-20, AC-21]</text>
    <text x="46" y="413">Commit / PR dialog [AC-25] · Undo turn [AC-28] · Backup [AC-29, AC-30]</text>
    <text x="46" y="458">Phone: LocalNotifications in platform.notify  [AC-31]</text>
  </g>
  <rect x="480" y="50" width="400" height="430" rx="10" fill="#eef3ee" stroke="#79747e"/>
  <text x="496" y="74" font-weight="600" fill="#1c1b1f">Local server (packages/tenon + core)</text>
  <g fill="#e8def8" stroke="#6750a4">
    <rect x="496" y="88" width="368" height="56" rx="6"/>
    <rect x="496" y="156" width="368" height="56" rx="6"/>
    <rect x="496" y="224" width="368" height="56" rx="6"/>
    <rect x="496" y="292" width="368" height="56" rx="6"/>
  </g>
  <g fill="#1c1b1f">
    <text x="506" y="110">GET /second-brain/vault/backlinks  [AC-6]</text>
    <text x="506" y="128">POST /second-brain/vault/page/move  [AC-8]</text>
    <text x="506" y="178">GET /second-brain/search  [AC-18]</text>
    <text x="506" y="196" font-size="11" fill="#49454f">vault pages + calendar + ThreadSearch over SQLite</text>
    <text x="506" y="246">POST /vcs/commit, /vcs/push, /vcs/pr  [AC-22..24]</text>
    <text x="506" y="264" font-size="11" fill="#49454f">git via Git.Service; PR via gh, args array, no shell</text>
    <text x="506" y="314">POST /file/revert  [AC-26, AC-27]</text>
    <text x="506" y="332" font-size="11" fill="#49454f">reverse a turn's patches inside the folder</text>
  </g>
  <g fill="#ffffff" stroke="#79747e">
    <rect x="496" y="364" width="368" height="100" rx="6"/>
  </g>
  <g fill="#1c1b1f">
    <text x="506" y="386">Unchanged and reused</text>
    <text x="506" y="404" font-size="11" fill="#49454f">vault page write/create/delete, timeline write, calendar write</text>
    <text x="506" y="420" font-size="11" fill="#49454f">agent write undo, session list, usage, platform.notify on desktop</text>
    <text x="506" y="436" font-size="11" fill="#49454f">trust: renderer sends workspace directory + relative paths;</text>
    <text x="506" y="452" font-size="11" fill="#49454f">every new route resolves inside its folder or vault</text>
  </g>
  <line x1="440" y1="260" x2="480" y2="260" stroke="#6750a4" stroke-width="1.5"/>
</svg>
